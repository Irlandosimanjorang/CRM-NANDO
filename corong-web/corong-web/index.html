    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA: biar bisa di-install ke HP kayak app native -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b101a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexto" />
    <meta name="mobile-web-app-capable" content="yes" />

         edge function temp-generate-og-image (udah dimatiin abis dipake) -
         kalau kontennya mau diganti, generate ulang & upload manual, bukan
         nyalain lagi function sekali-pakai itu. -->
    <meta name="description" content="Nexto - AI Sales Loop Engine untuk tim sales Indonesia. CRM yang otomatis nyimpen histori, ngasih rekomendasi harian, dan eksekusi follow-up - dibangun langsung oleh eks-salesperson." />
